// dev/storm.html?scene=rain|downpour|hail|wind|tornado|near|wedge|rope|multi|bolts|crawler|power|wheel|gallery|radar  &gfx=1 (real renderer)  &world=1

  g.uSunDir.value.set(-.75, .28, .45).normalize();
